# GitLab CI/CD configuration for Speedy Air Hockey Landing Page
# This file enables automatic deployment to GitLab Pages

stages:
  - deploy

# Deploy to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - echo "Deploying Speedy Air Hockey landing page to GitLab Pages"
    - echo "Build completed successfully"
  artifacts:
    paths:
      - ./
    expire_in: 1 week
  only:
    - main
    - master
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: always
    - when: never
