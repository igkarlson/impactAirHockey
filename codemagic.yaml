workflows:
  android:
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
        - ~/.android/build-cache
    environment:
      groups:
        - google_credentials
      android_signing:
        - codemagic
      vars:
        PACKAGE_NAME: 'com.speedyairhockey'
    scripts:
      - name: Install npm dependencies
        script: npm ci --verbose
      - name: Increment build number
        script: |
          set -e
          chmod +x ./scripts/update_android_build_number.sh
          ./scripts/update_android_build_number.sh
      - name: Expo Android prebuild
        script: npm run android-prebuild
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Configure Android signing
        script: |
          # Create key.properties file for signing configuration
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          
          # Update build.gradle to use proper signing configuration
          cat >> "$CM_BUILD_DIR/android/app/build.gradle" <<'EOF'
          
          // Codemagic signing configuration
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          
          android {
              signingConfigs {
                  release {
                      if (System.getenv()["CI"]) { // CI=true is exported by Codemagic
                          storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                          storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                          keyAlias System.getenv()["CM_KEY_ALIAS"]
                          keyPassword System.getenv()["CM_KEY_PASSWORD"]
                      } else {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build Android App Bundle
        script: |
          cd android
          # Get the updated build number from app.json
          VERSION_CODE=$(jq -r '.expo.android.versionCode // "1"' ../app.json)
          VERSION_NAME=$(jq -r '.expo.version // "1.0.0"' ../app.json)
          ./gradlew bundleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
    triggering:
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
      events:
        - push
  ios:
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - build/ios/ipa/*.ipa
    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods
    environment:
      groups:
        - app_store_credentials
        - github_credentials
        - gitlab_credentials
      ios_signing:
        bundle_identifier: com.speedyairhockey
        distribution_type: app_store
      vars:
        APP_STORE_APPLE_ID: 6751126539
        BUNDLE_ID: 'com.speedyairhockey'
        XCODE_SCHEME: 'SpeedyAirHockey'
        XCODE_WORKSPACE: 'SpeedyAirHockey.xcworkspace'
    integrations:
      app_store_connect: AuthKey_WTD5M2963K
    name: iOS
    publishing:
      app_store_connect:
        auth: integration
        cancel_previous_submissions: true
        submit_to_app_store: true
    scripts:
      - name: Install npm dependencies
        script: npm ci --verbose
      - name: Increment build number
        script: |
          set -e
          chmod +x ./scripts/update_ios_build_number.sh
          ./scripts/update_ios_build_number.sh
      - name: Expo iOS prebuild
        script: npm run ios-prebuild
      - name: Set Info.plist values
        script: |
          PLIST=$CM_BUILD_DIR/ios/$XCODE_SCHEME/Info.plist
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          $PLIST_BUDDY -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles --code-signing-setup-verbose-logging --warn-only -v
      - name: Build ipa for distribution
        script: xcode-project build-ipa --scheme "$XCODE_SCHEME" --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" -v
    triggering:
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
      events:
        - push
